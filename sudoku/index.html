<head>
	<!-- CSS for table -->
	<style>
		:root {
			@media (prefers-color-scheme: dark) {
				--accent: plum;
				--color: white;
				--border: #ddd;
				--background: #444;
			}

			@media (prefers-color-scheme: light) {
				--color: black;
				--accent: hotpink;
				--border: black;
				--background: #fff;
			}

			font-family: sans-serif;
			color: var(--color);
			background-color: var(--background);
		}

		.hidden {
			visibility: hidden;
			border: initial !important;
		}

		#wrapper {
			position: relative;
			width: 90vmin;
			height: 90vmin;
			margin: 0 auto;
		}

		.timer {
			font-family: monospace;
			text-align: center;
		}

		.local-helper {
			position: absolute;
			/* The 2px removed are table borders computations. */
			width: calc(100% / 9 - 2px);
			height: calc(100% / 9 - 2px);
			border: 2px solid var(--accent);
			color: color-mix(in srgb, var(--accent), transparent);
			font-size: 2em;
			font-weight: bolder;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		table {
			box-sizing: content-box;
			border-collapse: collapse;
			table-layout: fixed;
			tr td {
				text-align: center;
			}

			&.helper {
				position: absolute;
				&.global {
					top: 0;
					left: 0;
					width: 100%;
					height: 100%;
					td {
						font-size: 10em;
					}
				}
				&.group {
					width: calc(100% / 3);
					height: calc(100% / 3);
					td {
						font-size: 4em;
					}
				}
				&.col-0 {
					left: 0;
				}
				&.col-1 {
					left: calc(100% / 3);
				}
				&.col-2 {
					left: calc(2 * 100% / 3);
				}
				&.row-0 {
					top: 0;
				}
				&.row-1 {
					top: calc(100% / 3);
				}
				&.row-2 {
					top: calc(2 * 100% / 3);
				}

				td {
					border: 2px solid var(--accent);
					font-weight: bolder;
					color: color-mix(in srgb, var(--accent), transparent);
					background: color-mix(
						in srgb,
						var(--accent),
						transparent 80%
					);
				}
			}
			&:not(.helper) {
				width: 100%;
				height: 100%;

				tr {
					&:last-child {
						border-bottom: 2px solid var(--border);
					}

					&:nth-child(XXXn + 1) {
						border-top: 2px solid var(--border);
					}
				}
				td {
					font-size: 3em;
					border: 1px solid
						color-mix(in srgb, var(--border), var(--background));

					&:nth-child(XXXn) {
						border-right: 2px solid var(--border);
					}

					&:first-child {
						border-left: 2px solid var(--border);
					}

					&.prefilled {
						background-color: color-mix(
							in srgb,
							var(--background) 80%,
							var(--color)
						);
					}
				}
			}
		}
	</style>

	<script src="backtracking.js" defer type="module"></script>
	<script defer type="module">
		import { startGame, gameLoop } from './sudoku.js'

		// The left-hand centered 3x3 square of keys on a keyboard, whatever the layout,
		// mapped to sudoku board cells.
		const keyCodes = {
			KeyW: [0, 0],
			KeyE: [0, 1],
			KeyR: [0, 2],
			KeyS: [1, 0],
			KeyD: [1, 1],
			KeyF: [1, 2],
			KeyX: [2, 0],
			KeyC: [2, 1],
			KeyV: [2, 2],
		}

		const style = document.head.querySelector('style')
		const n = 3
		style.textContent = style.textContent.replaceAll('XXX', n)
		const board = startGame(n * n)
		console.log(board)

		document.addEventListener('keydown', await gameLoop(keyCodes, board))
	</script>
</head>
<body>
	<div id="wrapper">
		<div class="local-helper hidden"></div>
		<table class="helper global">
			<tr>
				<td class="helper-KeyW">Q</td>
				<td class="helper-KeyE">W</td>
				<td class="helper-KeyR">E</td>
			</tr>
			<tr>
				<td class="helper-KeyS">S</td>
				<td class="helper-KeyD">D</td>
				<td class="helper-KeyF">F</td>
			</tr>
			<tr>
				<td class="helper-KeyX">X</td>
				<td class="helper-KeyC">C</td>
				<td class="helper-KeyV">V</td>
			</tr>
		</table>
	</div>
	<p class="timer">00:00</p>
</body>
