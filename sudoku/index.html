<head>
	<!-- CSS for table -->
	<style>
		table {
			border-collapse: collapse;
			table-layout: fixed;
			width: 100%;
			tr {
				&:nth-child(3n) {
					border-bottom: 2px solid black;
				}

				&:nth-child(3n + 1) {
					border-top: 2px solid black;
				}
			}
			td {
				border: 1px solid gray;
				width: 50px;
				height: 50px;
				text-align: center;

				&:nth-child(3n) {
					border-right: 2px solid black;
				}

				&:nth-child(3n + 1) {
					border-left: 2px solid black;
				}
			}
		}
	</style>

	<script src="backtracking.js" defer type="module"></script>
	<script defer type="module">
		import { test } from './backtracking.js'
		test()
	</script>
</head>
<body>
	world
</body>
