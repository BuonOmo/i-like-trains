<head>
	<!-- CSS for table -->
	<style>
		table {
			border-collapse: collapse;
			table-layout: fixed;
			width: 100%;
			tr {
				&:last-child {
					border-bottom: 2px solid black;
				}

				&:nth-child(XXXn + 1) {
					border-top: 2px solid black;
				}
			}
			td {
				border: 1px solid gray;
				width: 50px;
				height: 50px;
				text-align: center;

				&:nth-child(XXXn) {
					border-right: 2px solid black;
				}

				&:first-child {
					border-left: 2px solid black;
				}
			}
		}
	</style>

	<script src="backtracking.js" defer type="module"></script>
	<script defer type="module">
		// import { test } from './backtracking.js'

		const style = document.head.querySelector('style')
		const n = 3
		style.textContent = style.textContent.replaceAll('XXX', n)
		// test(n * n)
		import { generateBoard } from './sudoku.js'
		generateBoard(n * n)
	</script>
</head>
<body></body>
